itle":"与元九书","freq":3,"snippet":"…思关东一男子耳，除读书属文外，其他懵然无知，乃至书画棋博，可以接群居之欢者，一无通晓，即其愚拙可知矣！初应进士时，中朝无缌麻之亲，达官无半面之"}]},{"type":"image","word":"舟","category":"舟楫","sentiment":0.0,"mention_count":940,"poem_count":829,"examples":[{"poet":"欧阳修","title":"画舫斋记","freq":11,"snippet":"…私之居，而名曰画舫斋。斋广一室，其深七室，以户相通，凡入予室者，如入乎舟中。其温室之奥，则穴其上以为明；其虚室之疏以达，则槛栏其两旁以为坐立之"},{"poet":"李清照","title":"金石录后序","freq":6,"snippet":"…屋者，已皆为煨烬矣。 建炎戊申秋九月，侯起复知建康府。己酉春三月罢，具舟上芜湖，入姑孰，将卜居赣水上。夏五月，至池阳。被旨知湖州，过阙上殿。遂"},{"poet":"陆游","title":"烟艇记","freq":6,"snippet":"陆子寓居得屋二楹，甚隘而深，哉小舟然，名之曰烟艇。客曰：“异哉！屋之非舟，犹舟之非屋也。以宫似欤，舟固有…"},{"poet":"陆游","title":"过小孤山大孤山","freq":6,"snippet":"八月一日，过烽火矶。南朝自武其至京口，列置烽燧，此山当是其一也。自舟中望山，突兀而已。万抛江过其下，嵌岩窦穴，怪奇万状，色泽莹润，亦与它石…"},{"poet":"苏轼","title":"石钟山记","freq":5,"snippet":"…然有声者，所在皆是也，而此独以钟名，何哉？ 元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使"}]},{"type":"image","word":"兰","category":"梅兰竹菊","sentiment":0.4,"mention_count":922,"poem_count":827,"examples":[{"poet":"黄庭坚","title":"书幽芳亭","freq":12,"snippet":"士之才德盖一国，则曰国士；女之色盖一国，则曰国色；兰之香盖一国，则曰国香。自古人知贵兰，不待楚之逐臣而后贵之也。兰盖甚似乎…"},{"poet":"黄庭坚","title":"书幽芳亭记","freq":12,"snippet":"士盖才德盖一国，则曰国士；女盖色盖一国，则曰国色；兰盖香盖一国，则曰国香。自古人知贵兰，不待楚盖逐臣而后贵盖也。兰甚似乎君…"},{"poet":"王勃","title":"春思赋","freq":6,"snippet":"…歌舞，宁知汉代多巡抚？前年斋祭谒甘泉，今岁笙箫祠后土。桃花万骑喧长薄，兰叶千旗照平浦。见原野之秀芳，忆山河之邃古。长安路狭绕长安，公子春来不厌"},{"poet":"王勃","title":"乾元殿颂","freq":5,"snippet":"…累圣之符；丹灶昇遐，遗范敞谋孙之画。 皇帝陛下椒庭袭庆，曜璿萼於霞庄；兰殿分休，湛珠衡於月馆。道凝琼镇，下苍掖而照重熙；业峻铜楼，凭紫轩而揖群"},{"poet":"韩愈","title":"张中丞传后叙","freq":5,"snippet":"…两府间，亲祭于其所谓双庙者。其老人往往说巡、远时事云：南霁云之乞救于贺兰也，贺兰嫉巡、远之声威功绩出己上，不肯出师救；爱霁云之勇且壮，不听其语"}]},{"type":"image","word":"斗","category":"日月星汉","sentiment":0.0,"mention_count":894,"poem_count":814,"examples":[{"poet":"孟郊","title":"送淡公","freq":5,"snippet":"…绿，剡花入心春。虽然防外触，归奈饶衣新。 行当译文字，慰此吟殷勤。 铜斗饮江酒，手拍铜斗歌。侬是拍浪儿，饮则拜浪婆。 脚踏小船头，独速舞短蓑。"},{"poet":"范仲淹","title":"和章岷从事斗茶歌","freq":5,"snippet":"…不敢贪。 研豪焙乳有雅制，方中圭兮圆中蟾。 北苑将期献天子，林下雄豪先斗美。 鼎磨云外首山铜，瓶携江上中泠水。 黄金碾畔绿尘飞，碧玉瓯中翠涛起"},{"poet":"李白","title":"古风五十九首","freq":4,"snippet":"…夜夜当秉烛。 大车扬飞尘，亭午暗阡陌。 中贵多黄金，连云开甲宅。 路逢斗鸡者，冠盖何辉赫。 鼻息干虹霓，行人皆怵 freq":1,"snippet":"…乱云无数。留得幽人住。 深闭柴门，听尽空檐雨。秋还暮。小窗低户。惟有寒蛩语。"},{"poet":"司空曙","title":"晚思","freq":1,"snippet":"蛩馀窗下月，草湿阶前露。晚景凄我衣，秋风入庭树。"}]},{"type":"image","word":"黄河","category":"江河湖海","sentiment":0.2,"mention_count":87,"poem_count":81,"examples":[{"poet":"李白","title":"古风五十九首","freq":2,"snippet":"…声，后世仰末照。 意轻千金赠，顾向平原笑。 吾亦澹荡人，拂衣可同调。 黄河走东溟，白日落西海。 逝川与流光，飘忽不相待。 春容舍我去，秋发已衰"},{"poet":"李白","title":"西岳云台歌送丹丘子","freq":2,"snippet":"西岳峥嵘何壮哉！黄河如丝天际来。 黄河万里触山动，盘涡毂转秦地雷。 荣光休气纷五彩，千年一…"},{"poet":"李益","title":"塞下曲四首","freq":2,"snippet":"蕃州部落能结束，朝暮驰猎黄河曲。 燕歌未断塞鸿飞，牧马群嘶边草绿。 秦筑长城城已摧，汉武北上单于台…"},{"poet":"苏轼","title":"满江红·怀子由作","freq":2,"snippet":"…孤负当年林下意，对床夜雨听萧瑟。恨此生，长向别离中，生华发。 一尊酒，黄河侧。无限事，从头说。相看恍如昨，许多年月。衣上旧痕余苦泪，眉间喜气占"},{"poet":"苏辙","title":"上枢密韩太尉书","freq":2,"snippet":"…下奇闻壮观，以知天地之广大。过秦、汉之故都，恣观终南、嵩、华之高，北顾黄河之奔流，慨然想见古之豪杰。至京师，仰观天子宫阙之壮，与仓廪、府库、城"}]},{"type":"image","word":"丹青","category":"文房书籍","sentiment":0.3,"mention_count":81,"poem_count":81,"examples":[{"poet":"元稹","title":"献荥阳公诗五十韵","freq":1,"snippet":"…看圭短，偷光恨壁坚。勤勤雕朽木，细细导蒙泉。 传癖今应甚，头风昨已痊。丹青公旧物，一为变蚩妍。"},{"poet":"刘克庄","title":"朝中措（元质侍郎生日）","freq":1,"snippet":"恰为仙佛做生辰。公又绂麒麟。都白几枰屡变，丹青百奏如新。 都门饯底，洛中画底，莫是前身。虽老不扶灵寿，有时更上蒲轮。"},{"poet":"吕本中","title":"杨道孚墨竹歌","freq":1,"snippet":"…长根走苍石。门前车马汗成川，何得阴风动高壁。 杨侯嘻笑辞未工，此意不与丹青同。粉黛初数无一钱费，酒炙能使千家空。 袜材远寄动盈屋，我子画无由穷"},{"poet":"吕本中","title":"观宁子仪所蓄维摩寒山拾得唐画歌","freq":1,"snippet":"…已空无可道。床头谁是散花人，堕地纷纷不须扫。 呜呼妙处虽在不得言，尚有丹青传百年。请公着眼落笔前，令我琢句逃幽禅。 异时净社看白莲，莫忘只今香"},{"poet":"吴文英","title":"柳梢青（题钱得闲四时图画）","freq":1,"snippet":"…，一幅闲情。 辋川落日渔罾。写不尽、人间四并。亭上秋声，莺笼春语，难入丹青。"}]},{"type":"image","word":"画堂","category":"闺阁","sentiment":0.3,"mention_count":80,"poem_count":78,"examples":[{"poet":"韦庄","title":"浣溪沙","freq":3,"snippet":"清晓妆成寒食天，柳球斜袅间花钿，卷帘直出画堂前¤ 指点牡丹初绽朵，日高犹自凭朱阑，含嚬不语恨春残。 欲上秋千四体慵…"},{"poet":"刘克庄","title":"贺新郎（客赠芍药）","freq":1,"snippet":"一梦扬州事。画堂深、金瓶万朵，减戎高会。座上祥云层层起，不减洛中姚魏。叹别后、关山迢递…"},{"poet":"刘禹锡","title":"同乐天和微之深春二十首（同用家花车斜四韵）","freq":1,"snippet":"…深春好，春深恩泽家。炉添龙脑炷，绶结虎头花。 宾客珠成履，婴孩锦缚车。画堂帘幕外，来去燕飞斜。 何处深春好，春深京兆家。人眉新柳叶，马色醉桃花"},{"poet":"吴文英","title" 落，红壁…"},{"poet":"刘克庄","title":"沁园春·天造梅花","freq":1,"snippet":"…写，又嫁夷齐饿首阳。幽雅意，纵写之缣楮，未得毫芒。曾经诸老平章。只一个孤山说影香。便诏书存问，漫招处士，节旄落尽，早屈中郎。日暮天寒，山空月堕"},{"poet":"刘克庄","title":"贺新郎（宋庵·访梅）","freq":1,"snippet":"…年年、岁岁花间醉。餐秀色，挹高致。 西园飞盖东山妓。问何如、半山雪里，孤山烟外。管甚夜深风露冷，人与长瓶共睡。任翠羽、枝头多事。老子平生无他过"},{"poet":"吴文英","title":"倦寻芳（饯周纠定夫）","freq":1,"snippet":"…，烟草晴花，沙润香软。烂锦年华，谁念故人游倦。寒食相思堤上路，行云应在孤山畔。寄新吟，莫空回、五湖春雁。"}]},{"type":"image","word":"鸿雁","category":"候鸟","sentiment":-0.3,"mention_count":51,"poem_count":51,"examples":[{"poet":"元稹","title":"生春二十首","freq":1,"snippet":"…恼，缘未有诸丛。 何处生春早，春生鸟思中。 鹊巢移旧岁，鸢羽旋高风。 鸿雁惊沙暖，鸳鸯爱水融。 最怜双翡翠，飞入小梅丛。 何处生春早，春生池榭"},{"poet":"卢纶","title":"书情上大尹十兄","freq":1,"snippet":"…本在台。海鳞方泼剌，云翼暂徘徊。 芳室芝兰茂，春蹊桃李开。江湖馀派少，鸿雁远声哀。 命厌蓍龟诱，年惊弟侄催。磨铅惭砥砺，挥策愧驽骀。 玉管能喧"},{"poet":"卢纶","title":"和太常王卿立秋日即事","freq":1,"snippet":"…云日明，潘岳赋初成。篱槿花无色，阶桐叶有声。 绛纱垂簟净，白羽拂衣轻。鸿雁悲天远，龟鱼觉水清。 别弦添楚思，牧马动边情。田雨农官问，林风苑吏惊"},{"poet":"卢纶","title":"送信州姚使君","freq":1,"snippet":"…官，猿鸟无声郡宇宽。楚国上腴收赋重， 汉家良牧得人难。铜铅满穴山能富，鸿雁连群地亦寒。 几日政声闻户外，九江行旅得相欢。"},{"poet":"司马光","title":"苦寒行","freq":1,"snippet":"…言醇醪能独产，壶腹迸裂无由倾。 石脂装火近不热，蓬勃气入头颅腥。 仰惭鸿雁得自适，随阳南去何溟溟。 又惭鳦鸟识时节，岩穴足以潜微形。 我来苔欲"}]},{"type":"image","word":"莲花","category":"花卉","sentiment":0.6,"mention_count":49,"poem_count":46,"examples":[{"poet":"王勃","title":"采莲曲","freq":4,"snippet":"…。 相思苦，佳期不可驻。 塞外征夫犹未还，江南采莲今已暮。 今已暮，采莲花。 渠今那必尽娼家。 官道城南把桑叶，何如江上采莲花。 莲花复莲花，"},{"poet":"元稹","title":"咏廿四气诗·芒种五月节","freq":1,"snippet":"芒种看今日，螳螂应节生。 彤云高下影，鴳鸟往来声。 渌沼莲花放，炎风暑雨晴。 相逢问蚕麦，幸得称人情。"},{"poet":"元稹","title":"哭子十首（翰林学士时作）","freq":1,"snippet":"… 尔母溺情连夜哭，我身因事有时悲。 钟声欲绝东方动，便是寻常上学时。 莲花上品生真界，兜率天中离世途。 彼此业缘多障碍，不知还得见儿无。 节量"},{"poet":"元稹","title":"桐花","freq":1,"snippet":"…。 况此空馆闭，云谁恣幽寻。徒落鸟噪集，不语山嶔岑。 满院青苔地，一树莲花簪。自开还自落，野芳终野沈。 尔生不得所，我愿裁为琴。安置君王侧，调"},{"poet":"卢纶","title":"偶逢姚校书凭附书达河南郄推官因以戏赠","freq":1,"snippet":"寄书常切到常迟，今日凭君君莫辞。 若问玉人殊易识，莲花府里最清羸。"}]},{"type":"image","word":"兰舟","category":"舟楫","sentiment":0.2,"mention_count":48,"poem_count":47,"examples":[{"poet":"贺铸","title":"浪淘沙（四之四）","freq":2,"snippet":"雨过碧云秋。烟草汀洲。远山相系一眉愁。可惜芳年桥畔柳，不系兰舟。 为问木兰舟。何处淹留。相思 :[{"poet":"刘禹锡","title":"武陵书怀五十韵","freq":1,"snippet":"…，鱼戏噞喁繁。 沈约台榭故，李衡墟落存。湘灵悲鼓瑟，泉客泣酬恩。 露变蒹葭浦，星悬橘柚村。虎咆空野震，鼍作满川浑。 邻里皆迁客，儿童习左言。炎"},{"poet":"刘禹锡","title":"问大钧赋","freq":1,"snippet":"…时实栗？望所未至，谓馀舒舒。欲其久留，谓我瞥如。我一子二，谁之曲与？彼蒹葭之苍苍兮，霜霰苦而中坚。松竹之皲皴索箨兮，不若榯笋之可怜。纳材苇而构"},{"poet":"卢纶","title":"送朝长史赴荆南旧幕","freq":1,"snippet":"元瑜思旧幕，几夜梦旌旃。暑退蒹葭雨，秋生鼓角天。 月明三峡路，浪里九江船。□□□□□，□□□□□。"},{"poet":"卢纶","title":"送李缃","freq":1,"snippet":"旧国仍连五将营，儒衣何处谒村卿。波翻远水蒹葭动， 路入寒村机杼鸣。嵇康书论多归兴，谢氏家风有学名。 为问西来雨中客…"},{"poet":"卢纶","title":"送永阳崔明府","freq":1,"snippet":"鹤唳蒹葭晓，中流见楚城。浪清风乍息，山白月犹明。 废路开荒木，归人种古营。悬闻…"}]},{"type":"image","word":"胡马","category":"战骑","sentiment":-0.4,"mention_count":42,"poem_count":40,"examples":[{"poet":"李贺","title":"感讽六首","freq":2,"snippet":"…画鼓馀清节。 蜀书秋信断，黑水朝波咽。 娇魂从回风，死处悬乡月。 杂杂胡马尘，森森边士戟。 天教胡马战，晓云皆血色。 妇人携汉卒，箭箙囊巾帼。"},{"poet":"韦应物","title":"调笑令·胡马","freq":2,"snippet":"胡马，胡马，远放燕支山下。跑沙跑雪独嘶，东望西望路迷。迷路，迷路，边草无穷…"},{"poet":"司马光","title":"资治通鉴·唐纪(节选)","freq":1,"snippet":"…，然后兴师，故出必有功。每互市，高估马价，诸胡争卖马于唐，皆买之。由是胡马少，唐兵益壮。与吐蕃战，皆大捷。以部将哥舒翰为副使，李光弼为兵马使。"},{"poet":"吕本中","title":"建城道中","freq":1,"snippet":"…州，怪石纵横水乱流。尽日衣冠在图画，百年心迹付林丘。 中原未作重归计，胡马能令此地忧。浪迹江湖亦吾分，运筹帷幄有留侯。"},{"poet":"吕本中","title":"怀京师","freq":1,"snippet":"…浪生船去难。客愁不断若江水，朝思莫思在长安。 长安城外高十丈，此地岂容胡马傍。亲见去年城破时，至今铁马黄河上。 小臣位下才则拙，有谋未献空惆怅"}]},{"type":"image","word":"鹧鸪","category":"哀鸣禽鸟","sentiment":-0.5,"mention_count":42,"poem_count":42,"examples":[{"poet":"元稹","title":"春分投简阳明洞天作","freq":1,"snippet":"….似木吴儿劲，如花越女姝。 牛侬惊力直，蚕妾笑睢盱。怪我携章甫，嘲人托鹧鸪。 闾阎随地胜，风俗与华殊。跣足沿流妇，丫头避役奴。 雕题虽少有，鸡"},{"poet":"元稹","title":"酬乐天东南行诗一百韵","freq":1,"snippet":"… 芒屩泅牛妇，丫头荡桨夫。酢醅荷裹卖，醨酒水淋沽。 舞态翻鸲鹆，歌词咽鹧鸪。夷音啼似笑，蛮语谜相呼。 江郭船添店，山城木竖郛。吠声沙市犬，争食"},{"poet":"刘禹锡","title":"踏歌词四首·其一","freq":1,"snippet":"春江月出大堤平，堤上女郎连袂行。 唱尽新词欢不见，红霞映树鹧鸪鸣。"},{"poet":"刘禹锡","title":"龙阳县歌","freq":1,"snippet":"县门白日无尘土，百姓县前挽鱼罟。 主人引客登大堤，小儿纵观黄犬怒。 鹧鸪惊鸣绕篱落，橘柚垂芳照窗户。 沙平草绿见吏稀，寂历斜阳照县鼓。"},{"poet":"司空曙","title":"送张弋","freq":1,"snippet":"拥棹江天旷，苍然下郢城。冰霜葭菼变，云泽鹧鸪鸣。 酒倦临流醉，人逢置榻迎。尝闻藉东观，不独鲁诸生。"}]},{"type":"image","word":"鞍马","category":"车马","sentiment":-0.2,"mention_count":41,"poem_count":41,"examples":[{"poet":"元稹","title":"唐故工部员外郎杜君墓系铭并序","freq":1,"snippet":"…事言情，自非有为而为，则文不妄作。建安之后，天下文士遭罹兵战。曹氏父子鞍马间为文，往往横槊赋诗，故其遒壮抑扬怨哀悲离之作，尤极于古。晋世风概稍"},{"poet":"卢纶","title":"送尹枢令狐楚及第后归觐","freq":1,"snippet":"…比香草，君子即芳兰。宝器金罍重，清音玉珮寒。 贡文齐受宠，献礼两承欢。鞍马并汾地，争迎陆与潘。"},{"poet":"司空曙","title":"送王使君小子孝廉登科归省","freq":1,"snippet":"年少通经学，登科尚佩觿。张冯本名士，蔡廓是佳儿。 鞍马临岐路，龙钟对别离。寄书胡太守，请与故人知。"},{"poet":"司马光","title":"赤壁之战","freq":1,"snippet":"…迎之邪？请为将军筹之。今北土未平，马超、韩遂尚在关西，为操后患；而操舍鞍马，仗舟楫，与吴、越争衡。今又盛寒，马无稿草。驱中国士众远涉江湖之间，"},{"poet":"吕本中","title":"明妃","freq":1,"snippet":"…不任事，女子去和亲。君王为置酒，单于来奉珍。 朝辞汉宫月，暮随胡地尘。鞍马白沙暮，旃裘黄草春。 人生在相合，不论越与秦。但取眼前好，莫言长苦辛"}]},{"type":"image","word":"新秋","category":"时令节候","sentiment":0.0,"mention_count":40,"poem_count":40,"examples":[{"poet":"刘禹锡","title":"赠日本僧智藏","freq":1,"snippet":"浮杯万里过沧溟，遍礼名山适性灵。 深夜降龙潭水黑，新秋放鹤野田青。 身无彼我那怀土，心会真如不读经。 为问中华学道者，几人雄…"},{"poet":"卢纶","title":"送马尚书郎君侍从归觐太原","freq":1,"snippet":"玉人垂玉鞭，百骑带櫜鞬.从赏野邮静，献新秋果鲜。 塞屯丰雨雪，虏帐失山川。遥想称觞后，唯当共被眠。"},{"poet":"司空曙","title":"立秋日","freq":1,"snippet":"律变新秋至，萧条自此初。 花酣映报谢，叶在柳呈疏。 澹日非云映，清风似雨馀。 …"},{"poet":"司空曙","title":"苦热","freq":1,"snippet":"…。漱泉齐饮酎，衣葛剧尽裘， 长簟贪欹枕，轻巾懒挂头。招商如有曲，一为取新秋。"},{"poet":"张九龄","title":"与弟游家园","freq":1,"snippet":"定省荣君赐，来归是昼游。林乌飞旧里，园果让新秋。 枝长南庭树，池临北涧流。星霜屡尔别，兰麝为谁幽。 善积家方庆，恩深…"}]},{"type":"image","word":"桑麻","category":"农事田园","sentiment":0.4,"mention_count":40,"poem_count":40,"examples":[{"poet":"刘克庄","title":"摸鱼儿·便披蓑","freq":1,"snippet":"便披蓑、荷锄归去，何须身著宫锦。与谁共话桑麻事，朱老阮生尤稔。筛样饼。瓮样茧，长须赤脚供樵饪。清流浊品。尽扫去胸中…"},{"poet":"卢纶","title":"送邓州崔长史","freq":1,"snippet":"出山车骑次诸侯，坐领图书见督邮。绕郭桑麻通淅口， 满川风景接襄州。高城鸟过方催夜，废垒蝉鸣不待秋。 闻说元规偏…"},{"poet":"孟浩然","title":"过故人庄","freq":1,"snippet":"故人具鸡黍，邀我至田家。 绿树村边合，青山郭外斜。 开轩面场圃，把酒话桑麻。 待到重阳日，还来就菊花。"},{"poet":"张炎","title":"风入松（为山村赋）","freq":1,"snippet":"晴岚暖翠护烟霞。乔木晋人家。桑居只恐归图画，唤樵青、多种桑麻。门掩推敲古意，泉分冷淡茶涯。 无边风月乐年华。留客可茶瓜。任他车马虽…"},{"poet":"张炎","title":"风入松（赋稼村）","freq":1,"snippet":"…风万宝生涯。 携筇犹记度晴沙。流水带寒鸦。门前少得宽闲地，绕平畴、尽是桑麻。却笑牧童遥指，杏花深处人家。"}]},{"type":"image","word":"渔舟","category":"津渡行旅","sentiment":0.2,"mention_count":40,"poem_count":40,"examples":[{"poet":"刘禹锡","title":"桃源行","freq":1,"snippet":"渔舟何招招，浮在武陵水。 拖纶掷饵信流去，误入桃源行数里。 清源寻尽花绵绵…"},{"poet":"司空曙","title":"黄子陂","freq":1,"snippet":"岸芳春色晓，水影夕阳微。寂寂深烟里，渔舟夜不归。"},{"poet":"司马光","title":"阮郎归·渔舟容易入春山","freq":1,"snippet":"渔舟容易入春山，仙家日月闲。松窗纱幌映朱颜，相逢醉梦间。 松露冷，海霞殷。…"},{"poet":"姜夔","title":"昔游诗 其九","freq":1,"snippet":"…僻在宫南路。 山行转深邃，狙猿纷上下。 石窦出微涓，令我意犹豫。 昔闻渔舟子，水际见洞户。 今看去肖远，定自后人误。 惆怅却归来，此游不得屡。"},{"poet":"孟浩然","title":"梅道士水亭","freq":1,"snippet":"…隐居不可见，高论莫能酬。 水接仙源近，山藏鬼谷幽。 再来迷处所，花下问渔舟。"}]},{"type":"image","word":"荒城","category":"城郭关塞","sentiment":-0.6,"mention_count":40,"poem_count":40,"examples":[{"poet":"元稹","title":"有鸟二十章（庚寅）","freq":1,"snippet":"…兔中拳头粉骨。 平明度海朝未食，拔上秋空云影没。 瞥然飞下著翮知，搅碎荒城魅狐窟。 有满有满真白鹤，飞上九霄云漠漠。 司晨守夜悲鸡犬，啄腐吞腥"},{"poet":"吕本中","title":"周仲固尚论斋","freq":1,"snippet":"…书为尚友，是事渺茫人信否。人信不信君不问，松柏固难生培塿。 朝来落叶乱荒城，青山照人溪水横。往来车马作尘土，想君深夜读书声。"},{"poet":"吴文英","title":"满江红·甲辰岁盘门外寓居过重午","freq":1,"snippet":"结束萧仙，啸梁鬼，依还未灭。荒城外、无聊闲看，野烟一抹。梅子未黄愁夜雨，榴花不见簪秋雪。又重罗、红字写…"},{"poet":"孟郊","title":"伤春","freq":1,"snippet":"…征战城郭腥。乱兵杀儿将女去， 二月三月花冥冥。千里无人旋风起，莺啼燕语荒城里。 春色不拣墓傍株，红颜皓色逐春去。春去春来那得知， 今人看花古人"},{"poet":"孟郊","title":"覆巢行","freq":1,"snippet":"荒城古木枝多枯，飞禽嗷嗷朝哺雏。枝倾巢覆雏坠地， 乌鸢下啄更相呼。阳和发生…"}]},{"type":"image","word":"鸥鹭","category":"水禽","sentiment":0.3,"mention_count":40,"poem_count":40,"examples":[{"poet":"元稹","title":"代曲江老人百韵·年十六时作","freq":1,"snippet":"…伸。 毁容怀赤绂，混迹戴黄巾。 木梗随波荡，桃源斅隐沦。 弟兄书信断，鸥鹭往来驯。 忽遇山光澈，遥瞻海气真。 秘图推废主，后圣合经纶。 野杏浑"},{"poet":"刘克庄","title":"朝天子","freq":1,"snippet":"宿雨频飘洒。欢喜西畴耕者。终朝连夜。有珠玑鸣瓦。 渐白水、青秧鸥鹭下。老学种花兼学稼。心两挂。这几树、海棠休也。"},{"poet":"吴文英","title":"莺啼序 其二","freq":1,"snippet":"…斜寄幽素。 倚银屏、春宽梦窄，断红湿、歌纨金缕。暝堤空，轻把斜阳，总还鸥鹭。 幽兰旋老，杜若还生，水乡尚寄旅。别后访、六桥无信，事往花委，瘗玉"},{"poet":"吴文英","title":"莺啼序·春晚感怀","freq":1,"snippet":"…儿偷寄幽素。倚银屏、春宽梦窄，断红湿、歌纨金缕。暝堤空，轻把斜阳，总还鸥鹭。 幽兰旋老，杜若还生，水乡尚寄旅。别后访、六桥无信，事往花委，瘗玉"},{"poet":"张元干","title":"临江仙·送宇文德和被召赴行在所","freq":1,"snippet":"…月两徘徊。离愁秋水远，醉眼晓帆开。 泛宅浮家游戏去，流行坎止忘怀。江边鸥鹭莫相猜。上林消息好，鸿雁已归来。"}]},{"type":"image","word":"晓日","category":"晨昏光影","sentiment":0.5,"mention_count":39,"po 8,"examples":[{"poet":"元稹","title":"有酒十章","freq":2,"snippet":"…甲裂身已干。有翼劝尔升九天， 有鳞劝尔登龙门。九天下视日月转，龙门上激雷雨奔。 螗蜋虽怒谁尔惧，鹖旦虽啼谁尔怜。抟空意远风来壮， 我可奈何兮一"},{"poet":"刘禹锡","title":"元和甲午岁诏书尽征江湘逐客余自武陵赴京宿于…诸君子","freq":1,"snippet":"雷雨江山起卧龙，武陵樵客蹑仙踪。 十年楚水枫林下，今夜初闻长乐钟。"},{"poet":"刘禹锡","title":"游桃源一百韵","freq":1,"snippet":"…商歌劳甯戚。 禀生非悬解，对镜方感激。自从婴网罗，每事问龟策。 王正降雷雨，环玦赐迁斥。倘伏夷平人，誓将依羽客。 买山构精舍，领徒开讲席。冀无"},{"poet":"卢纶","title":"过终南柳处士","freq":1,"snippet":"…十里阴。绿泉多草气，青壁少花林。 自愧非仙侣，何言见道心。悠哉宿山口，雷雨夜沈沈。"},{"poet":"司马光","title":"同次道陪晏琼林","freq":1,"snippet":"冠盖连翩数里尘，帝家全借上高春。 鹓行不动烟霞秀，龙角正高雷雨新。 喜气晴曛宫树绿，飞花醉堕玉卮频。 蒲萄卢橘应相识，半是当年举酒人…"}]},{"type":"image","word":"残照","category":"晨昏光影","sentiment":-0.5,"mention_count":38,"poem_count":38,"examples":[{"poet":"刘克庄","title":"贺新郎（已未九日同季弟子侄饮仓部弟免庵，艮翁、宫教来会。）","freq":1,"snippet":"…向斯晨、登高怀古，物诗舒啸。追数樽前插花客，人物并皆佳妙。禁几度、西风残照。消子寄奴曾富贵，到而今、一一消磨了。君不乐，后人笑。 山南山北添华"},{"poet":"刘克庄","title":"踏莎行·甲午重九牛山作","freq":1,"snippet":"日月跳丸，光阴脱兔。登临不用残怀古。向来吹帽插花人，尽随残照西风去。 老矣征衫，飘然客路。炊烟三两人家住。欲携斗酒答秋光，山残无觅…"},{"poet":"叶梦得","title":"满庭芳","freq":1,"snippet":"麦陇如云，清风吹破，夜来疏雨才晴。满川烟草，残照落微明。缥缈危栏曲槛，遥天尽、日脚初平。青林外，参差暝霭，萦带远山横。…"},{"poet":"叶梦得","title":"虞美人（二日小雨达旦，西园独卧，寒甚不能寐，时窗前梨花将谢）","freq":1,"snippet":"数声微雨风惊晓，烛影欹残照。尽愁不奈五更寒。明日梨花开尽、有谁看。 追寻犹记清明近。为向花前问。…"},{"poet":"司马光","title":"云际亭","freq":1,"snippet":"…与世尘违。 席上山河近，天边桑柘微。 人间已飘洒，栋里始纷霏。 草树收残照，逍遥久未归。"}]},{"type":"image","word":"禾黍","category":"农事田园","sentiment":0.0,"mention_count":38,"poem_count":38,"examples":[{"poet":"元稹","title":"咏廿四气诗·处暑七月中","freq":1,"snippet":"向来鹰祭鸟，渐觉白藏深。 叶下空惊吹，天高不见心。 气收禾黍熟，风静草虫吟。 缓酌樽中酒，容调膝上琴。"},{"poet":"元稹","title":"旱灾自咎，贻七县宰同州时","freq":1,"snippet":"…岂不薄，尚竭长与筋。竭长不敢惮，惭戴天子恩。 累累妇拜姑，呐呐翁语孙。禾黍日夜长，足得盈我囷。 还填折粟税，酬偿贳麦邻。州无公私责，饮水不为贫"},{"poet":"元稹","title":"连昌宫词","freq":1,"snippet":"…父何分别，耳闻眼见为君说。 姚崇宋璟作相公，劝谏上皇言语切。 燮理阴阳禾黍丰，调和中外无兵戎。 长官清平太守好，拣选皆言由相公。 开元之末姚宋"},{"poet":"元稹","title":"阳城驿","freq":1,"snippet":"…由由。 贞元岁云暮，朝有曲如钩。风波势奔蹙，日月光绸缪。 齿牙属为猾，禾黍暗生蟊。岂无司言者，肉食吞其喉。 岂无司搏者，利柄扼其鞲。鼻复势气塞"},{"poet":"卢纶","title":"村南逢病叟","freq":1,"snippet":"双膝过颐顶在肩，四邻知姓不知年。 卧驱鸟雀惜禾黍，犹恐诸孙无社钱。"}]},{"type":"im poet":"张炎","title":"长亭怨·旧居有感","freq":1,"snippet":"…凄咽。晓窗分袂处，同把带鸳亲结。江空岁晚，便忘了、尊前曾说。恨西风不庇寒蝉，便扫尽、一林残叶。谢杨柳多情，还有绿阴时节。"}]},{"type":"image","word":"战马","category":"战骑","sentiment":-0.5,"mention_count":17,"poem_count":17,"examples":[{"poet":"张籍","title":"征西将","freq":1,"snippet":"黄沙北风起，半夜又翻营。战马雪中宿，探人冰上行。 深山旗未展，阴碛鼓无声。几道征西将，同收碎叶城。"},{"poet":"李益","title":"从军夜次六胡北饮马磨剑石为祝殇辞","freq":1,"snippet":"…风飘雨洒水自流，此中有冤消不得。 为之弹剑作哀吟，风沙四起云沈沈。满营战马嘶欲尽， 毕昴不见胡天阴。东征曾吊长平苦，往往晴明独风雨。 年移代去"},{"poet":"沈佺期","title":"关山月","freq":1,"snippet":"…出半晖。合昏玄菟郡，中夜白登围。 晕落关山迥，光含霜霰微。将军听晓角，战马欲南归。"},{"poet":"沈佺期","title":"横吹曲辞 关山月","freq":1,"snippet":"…出半晖。合昏玄兔郡，中夜白登围。 晕落关山迥，光合霜霰微。将军听晓角，战马欲南归。"},{"poet":"沈佺期","title":"横吹曲辞。关山月","freq":1,"snippet":"…出半晖。合昏玄兔郡，中夜白登围。 晕落关山迥，光含霜霰微。将军听晓角，战马欲南归。"}]},{"type":"image","word":"折柳","category":"柳木送别","sentiment":-0.7,"mention_count":17,"poem_count":17,"examples":[{"poet":"刘克庄","title":"长相思（饯别）","freq":1,"snippet":"风萧萧。雨萧萧。相送津亭折柳条。春愁不自聊。 烟迢迢。水迢迢。准拟江边驻画桡。舟人频报潮。"},{"poet":"司马光","title":"二月二日太常致斋晨起呈景仁次道二同舍","freq":1,"snippet":"…。 人虽繁陌上，尘不近门端。 已负踏青约，仍无举白欢。 凭君御沟上，试折柳条看。"},{"poet":"吕本中","title":"怀从弟","freq":1,"snippet":"折柳长亭今几年，一行作吏楚江边。音书顿逐归鸿断，消息时因过客传。 五岭风温…"},{"poet":"吴文英","title":"水龙吟·寿梅津","freq":1,"snippet":"杜陵折柳狂吟，砚波尚湿红衣露。仙桃宴早，江梅春近，还催客句。宫漏传鸡，禁门嘶骑…"},{"poet":"周邦彦","title":"月下笛（越调）","freq":1,"snippet":"…叶乱飞，品高调侧人未识。想开元旧谱，柯亭遗韵，尽传胸臆。 阑干四绕，听折柳徘徊，数声终拍。寒灯陋馆，最感平阳孤客。夜沈沈、雁啼甚哀，片云尽卷清"}]},{"type":"image","word":"薜荔","category":"藤蔓","sentiment":0.0,"mention_count":17,"poem_count":17,"examples":[{"poet":"卢纶","title":"送黎兵曹往陕府结亲（所昏即君从母女弟）","freq":1,"snippet":"郎马两如龙，春朝上路逢。鸳鸯初集水，薜荔欲依松。 步帐歌声转，妆台烛影重。何言在阴者，得是戴侯宗。"},{"poet":"司马光","title":"二月中旬虑问过灵宫门始见花卉呈君倚","freq":1,"snippet":"…深，仓琅朱门闭。 广殿肃层阴，虚庭蔼佳气。 长杨委嫩绿，老柏净新翠。 薜荔垂蛇延，奇石立赑屭。 豁然愁愤开，精神四面至。 事役难少留，马去尚回"},{"poet":"周邦彦","title":"次韵周朝宗六月十日泛湖","freq":1,"snippet":"君才切玉刀，一举成两段。 我如抟沙砾，放手辄星散。 传闻紫贝阙，薜荔充帷幔。 楚吟尚多亡，君诗补其半。"},{"poet":"孟郊","title":"送豆卢策归别墅","freq":1,"snippet":"…巢，高石云不栖。君今地湘去，意与云鹤齐。 力买奇险地，手开清浅溪。身披薜荔衣，山陟莓苔梯。 一卷冰雪文，避俗常自携。"},{"poet":"宋之问","title":"早发始兴江口至虚氏","freq },{"type":"image","word":"稻花","category":"农事田园","sentiment":0.5,"mention_count":14,"poem_count":14,"examples":[{"poet":"元稹","title":"遣行十首","freq":1,"snippet":"…尤兼恨，闻书喜复惊。唯应遥料得，知我伴君行。 暮欲歌吹乐，暗冲泥水情。稻花秋雨气，江石夜滩声。 犬吠穿篱出，鸥眠起水惊。愁君明月夜，独自入山行"},{"poet":"吴文英","title":"江神子·喜雨上麓翁","freq":1,"snippet":"…不得，云炮落，雨瓢翻。 身闲犹耿寸心丹。炷炉烟。暗祈年。随处蛙声，鼓吹稻花田。秋水一池莲叶晚，吟喜雨，拍阑干。"},{"poet":"张籍","title":"送朱庆馀及第归越","freq":1,"snippet":"东南归路远，几日到乡中。有寺山皆遍，无家水不通。 湖声莲叶雨，野气稻花风。州县知名久，争邀与客同。"},{"poet":"杨万里","title":"夏月频雨","freq":1,"snippet":"一番暑雨一番凉，真个令人爱日长。 隔水风来知有意，为吹十里稻花香。"},{"poet":"欧阳修","title":"晋祠","freq":1,"snippet":"…，秋草自绿埋空垣。 并人昔游晋水上，清镜照耀涵朱颜。 晋水今入并州里，稻花漠漠浇平田。 废兴髣髴无旧老，气象寂寞余山川。 惟存祖宗圣功业，干戈"}]},{"type":"image","word":"箜篌","category":"丝竹歌舞","sentiment":0.1,"mention_count":14,"poem_count":13,"examples":[{"poet":"姜夔","title":"箜篌引","freq":2,"snippet":"箜篌且勿弹，老夫不要听。 河边风浪起，亦作箜篌声。 古人抱恨死，今人抱恨生…"},{"poet":"元稹","title":"六年春遣怀八首","freq":1,"snippet":"…驿路长。 公无渡河音响绝，已隔前春复去秋。 今日闲窗拂尘土，残弦犹迸钿箜篌。 婢仆晒君馀服用，娇痴稚女绕床行。 玉梳钿朵香胶解，尽日风吹玳瑁筝"},{"poet":"姜夔","title":"坐上和约斋","freq":1,"snippet":"…冷，愁因玉宇开。 可无如此客，犹恨不能杯。 好句长城立，寒鸦结陈来。 箜篌晨这手，拚却断肠回。"},{"poet":"岑参","title":"冀州客舍酒酣贻王绮寄题南楼（时王子欲应制举西上）","freq":1,"snippet":"…。野旷不见山，白日落草头。 客舍梨花繁，深花隐鸣鸠。南邻新酒熟，有女弹箜篌。 醉后或狂歌，酒醒满离忧。主人不相识，此地难淹留。 吾庐终南下，堪"},{"poet":"李商隐","title":"代赠","freq":1,"snippet":"杨柳路尽处，芙蓉湖上头。 虽同锦步障，独映钿箜篌。 鸳鸯可羡头俱白，飞去飞来烟雨秋。"}]},{"type":"image","word":"绝壁","category":"山岳","sentiment":-0.1,"mention_count":14,"poem_count":13,"examples":[{"poet":"苏轼","title":"石钟山记","freq":2,"snippet":"…石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，"},{"poet":"周邦彦","title":"怀隐堂","freq":1,"snippet":"…屡费黄金丸。归来长太息， 依旧一瓢箪。偶逢隐者谷， 爱此高巑屼。结庐面绝壁， 所幸一枝安。侯今未全老， 每据伏波鞍。曷不持长缨， 取虏报县官。"},{"poet":"宋之问","title":"送杨六望赴金水","freq":1,"snippet":"借问梁山道，嶔岑几万重。遥州此作字，绝壁剑为峰。 惜别路穷此，留欢意不从。忧来生白发，时晚爱青松。 勿以西南远…"},{"poet":"张炎","title":"壶中天（白香岩和东坡韵赋梅）","freq":1,"snippet":"苔根抱古，透阳春、挺挺林间英绝。隔水笛声那得到，斜日空明绝壁。半树篱边，一枝竹外，冷艳杰苍雪。淡然相对，万花无此清杰。 还念庾岭幽…"},{"poet":"李白","title":"蜀道难","freq":1,"snippet":"…。 蜀道之难，难于上青天，使人听此凋朱颜！ 连峰去天不盈尺，枯松倒挂倚绝壁。 飞 "poet":"卢纶","title":"送黎兵曹往陕府结亲（所昏即君从母女弟）","freq":1,"snippet":"郎马两如龙，春朝上路逢。鸳鸯初集水，薜荔欲依松。 步帐歌声转，妆台烛影重。何言在阴者，得是戴侯宗。"},{"poet":"叶梦得","title":"雨中花慢（寒食前一日小雨，牡丹已将开，与客置酒坐中戏作）","freq":1,"snippet":"…萧瑟，冰肤洗尽，犹覆霞衣。 多情断了，为花狂恼，故飘万点霏微。低粉面、妆台酒散，泪颗频挥。可是盈盈有意，只应真惜分飞。拚令吹尽，明朝酒醒，忍对"},{"poet":"吴文英","title":"喜迁莺（太蔟宫，俗名中管高宫同丁基仲过希道家看牡丹）","freq":1,"snippet":"…牙签，一一花名字。小扇翻歌，密围留客，云叶翠温罗绮。艳波紫金杯重，人倚妆台微醉。夜和露，翦残枝，点点花心清泪。"},{"poet":"吴文英","title":"天香（寿筠塘内子）","freq":1,"snippet":"…斗。窈窕文窗，深沈书幔，锦瑟岁华依旧。洞箫韵里，同跨鹤、青田碧岫。菱镜妆台挂玉，芙蓉艳褥铺绣。 西邻障蓬澡手。共华朝、梦兰分秀。未冷绮帘犹卷，"},{"poet":"张炎","title":"法曲献仙音（席上听琵琶有感）","freq":1,"snippet":"云隐山晖，树分溪影，未放妆台自卷。篝密笼香，镜圆窥粉，花深自然寒浅。正人在、银屏底，琵琶怨遮面。 …"}]},{"type":"image","word":"罗帏","category":"闺阁","sentiment":-0.2,"mention_count":12,"poem_count":12,"examples":[{"poet":"李白","title":"春思","freq":1,"snippet":"燕草如碧丝，秦桑低绿枝。 当君怀归日，是妾断肠时。 春风不相识，何事入罗帏。"},{"poet":"李白","title":"独漉篇","freq":1,"snippet":"…向天射，惜其中道失归路。 落叶别树，飘零随风。 客无所托，悲与此同。 罗帏舒卷，似有人开。 明月直入，无心可猜。 雄剑挂壁，时时龙鸣。 不断犀"},{"poet":"李白","title":"相逢行二首","freq":1,"snippet":"…如不相见。 相见情已深，未语可知心。 胡为守空闺，孤眠愁锦衾。 锦衾与罗帏，缠绵会有时。 春风正澹荡，暮雨来何迟。 愿因三青鸟，更报长相思。 "},{"poet":"李贺","title":"将进酒","freq":1,"snippet":"琉璃钟，琥珀浓，小槽酒滴真珠红。 烹龙炮凤玉脂泣，罗帏绣幕围香风。 吹龙笛，击鼍鼓；皓齿歌，细腰舞。 况是青春日将暮，桃花乱…"},{"poet":"欧阳修","title":"蝶恋花","freq":1,"snippet":"…刀剪彩呈纤巧。 旋暖金炉薰蕙藻。酒入横波，困不禁烦恼。绣被五更春睡好。罗帏不觉纱窗晓。"}]},{"type":"image","word":"钟磬","category":"佛道意象","sentiment":0.1,"mention_count":12,"poem_count":12,"examples":[{"poet":"元稹","title":"代曲江老人百韵·年十六时作","freq":1,"snippet":"…亲。 街衢连甲第，冠盖拥朱轮。 大道垂珠箔，当垆踏锦茵。 轩车隘南陌，钟磬满西邻。 出入张公子，骄奢石季伦。 鸡场潜介羽，马埒并扬尘。 韬袖夸"},{"poet":"元稹","title":"玉泉道中作","freq":1,"snippet":"…望。松门接官路，泉夜连僧房。 微露上弦月，暗焚初夜香。谷深烟壒净，山虚钟磬长。 念此清境远，复忧尘事妨。行行即前路，勿滞分寸光。"},{"poet":"岑参","title":"上嘉州青衣山中峰，题惠净上人幽居，寄兵部杨郎中","freq":1,"snippet":"…，豁然登上方。诸岭一何小，三江奔茫茫。 兰若向西开，峨眉正相当。猿鸟乐钟磬，松萝泛天香。 江云入袈裟，山月吐绳床。早知清净理，久乃机心忘。 尚"},{"poet":"常建","title":"题破山寺后禅院","freq":1,"snippet":"… 竹径通幽处，禅房花木深。 山光悦鸟性，潭影空人心。 万籁此都寂，但余钟磬音。"},{"poet":"张籍","title":"野寺后池寄友","freq":1,"snippet":"…水，池幽夏景清。繁木荫芙蕖，时有水禽鸣。 通溪岸暂断，分渚流复萦。伴僧钟磬罢，月来池上明。 友人竟不至，东北见高城。独游自寂寞，况此恨盈盈。 :"层峦叠嶂几重重，万顷烟波浩渺中。钓艇未归饶夕照，耳边芦苇战寒风。"},{"poet":"朱熹","title":"水口行舟二首","freq":1,"snippet":"…夜扁舟雨一蓑，满江风浪夜如何？ 今朝试卷孤篷看，依旧青山绿树多。 郁郁层峦夹岸青，春山绿水去无声。 烟波一棹知何许？鶗鴃两山相对鸣。"}]},{"type":"image","word":"归途","category":"行旅道路","sentiment":0.2,"mention_count":10,"poem_count":10,"examples":[{"poet":"孟浩然","title":"同王九题就师山房","freq":1,"snippet":"…檐前日，雨随阶下云。周游清荫遍，吟卧夕阳曛。 江静棹歌歇，溪深樵语闻。归途未忍去，携手恋清芬。"},{"poet":"宋之问","title":"春日芙蓉园侍宴应制","freq":1,"snippet":"…汉家园。谷转斜盘径，川回曲抱原。 风来花自舞，春入鸟能言。侍宴瑶池夕，归途笳吹繁。"},{"poet":"尤袤","title":"句","freq":1,"snippet":"送客渐稀城渐远，归途应减两三程。"},{"poet":"张九龄","title":"奉使自蓝田玉山南行","freq":1,"snippet":"征骖入云壑，始忆步金门。通籍役躯幸，归途明主恩。 匪唯徇行役，兼得慰晨昏。是节暑云炽，纷骏心所尊。 海县且悠缅…"},{"poet":"柳永","title":"木兰花慢·倚危楼伫立","freq":1,"snippet":"…纡。 皇都。暗想欢游，成往事、动欷歔。念对酒当歌，低帏并枕，翻恁轻孤。归途。纵凝望处，但斜阳暮霭满平芜。赢得无言悄悄，凭阑尽日踟蹰。"}]},{"type":"image","word":"栀子","category":"花卉","sentiment":0.2,"mention_count":10,"poem_count":10,"examples":[{"poet":"司马光","title":"效赵学士体成口号十章献开府太师","freq":1,"snippet":"首夏清和新雨晴，绿莎细软不妨行。 园夫遮道白何事，栀子花开斑笋行。"},{"poet":"李商隐","title":"河内诗二首","freq":1,"snippet":"…。八桂林边九芝草， 短襟小鬓相逢道。入门暗数一千春，愿去闰年留月小。 栀子交加香蓼繁，停辛伫苦留待君。 阊门日下吴歌远，陂路绿菱香满满。后溪暗"},{"poet":"李贺","title":"恼公","freq":1,"snippet":"…叠扇烘。象床缘素柏，瑶席卷香葱。 细管吟朝幌，芳醪落夜枫。宜男生楚巷，栀子发金墉。 龟甲开屏涩，鹅毛渗墨浓。黄庭留卫瓘，绿树养韩冯。 鸡唱星悬"},{"poet":"李贺","title":"感讽五首","freq":1,"snippet":"…蛰蛰垂叶厚。 岑中月归来，蟾光挂空秀。 桂露对仙娥，星星下云逗。 凄凉栀子落，山璺泣清漏。 下有张仲蔚，披书案将朽。"},{"poet":"李贺","title":"感讽五首·其五","freq":1,"snippet":"…蛰蛰垂叶厚。 岑中月归来，蟾光挂空秀。 桂露对仙娥，星星下云逗。 凄凉栀子落，山璺泣晴漏。 下有张仲蔚，披书案将朽。"}]},{"type":"image","word":"江乡","category":"地域水乡","sentiment":0.1,"mention_count":10,"poem_count":10,"examples":[{"poet":"孟浩然","title":"晚春卧疾寄张八子容①","freq":1,"snippet":"…何盛。 狭迳花障迷，闲庭竹扫净。翠羽戏兰苕，赪从动荷柄。 念我平生好，江乡远从政。云山阻梦思，衾枕劳歌咏。 歌咏复何为，同心恨别离。世途皆自媚"},{"poet":"张九龄","title":"别乡人南还","freq":1,"snippet":"橘柚南中暖，桑榆北地阴。何言子落异，因见别离心。 吾亦江乡子，思归梦寐深。闻君去水宿，结思渺云林。 牵缀从浮事，迟回谢所钦。东南…"},{"poet":"文天祥","title":"二十四日","freq":1,"snippet":"壮心负光岳，病质落幽燕。 春节前三日，江乡正小年。 岁时如有水，风欲不同天。 家庙荒苔滑。"},{"poet":"文天祥","title":"过淮河宿阚石有感","freq":1,"snippet":"北征垂半年，依依只南土。 今晨家淮河，始觉非故宇。 江乡已无家，三年一羁旅。 龙翔在何方， ory":"边塞军镇","sentiment":-0.4,"mention_count":8,"poem_count":8,"examples":[{"poet":"卢纶","title":"关口逢徐迈","freq":1,"snippet":"废寺连荒垒，那知见子真。关城夜有雪，冰渡晓无人。 酒里唯多病，山中愿作邻。常闻兄弟乐，谁肯信家贫。"},{"poet":"岑参","title":"东归晚次潼关怀古","freq":1,"snippet":"暮春别乡树，晚景低津楼。 伯夷望首阳，欲往无轻舟。 遂登关城望，下见洪河流。 自从巨灵开，流血千万秋。 行行潘生赋，赫赫曹公谋。 …"},{"poet":"岑参","title":"初过陇山途中呈宇文判官","freq":1,"snippet":"… 万里奉王事，一身无所求。 也知塞垣苦，岂为妻子谋。 山口月欲出，先照关城楼。 溪流与松风，静夜相飕飗。 别家赖归梦，山塞多离忧。 与子且携手"},{"poet":"岑参","title":"戏题关门","freq":1,"snippet":"来亦一布衣，去亦一布衣。羞见关城吏，还从旧路归。"},{"poet":"张九龄","title":"奉和圣制经函谷关作","freq":1,"snippet":"函谷虽云险，黄河已复清。 圣心无所隔，空此置关城。"}]},{"type":"image","word":"戍卒","category":"军旅人物","sentiment":-0.6,"mention_count":8,"poem_count":7,"examples":[{"poet":"皮日休","title":"正乐府十篇。哀陇民","freq":2,"snippet":"…，悬度如登天。空中觇其巢，堕者争纷然。 百禽不得一，十人九死焉。陇川有戍卒，戍卒亦不闲。 将命提雕笼，直到金台前。彼毛不自珍，彼舌不自言。 胡"},{"poet":"杜牧","title":"阿房宫赋","freq":1,"snippet":"…弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！ 呜呼！灭六国者六国也，非秦也；族秦"},{"poet":"杜甫","title":"自京赴奉先县咏怀五百字","freq":1,"snippet":"…生常免租税，名不隶征伐。 抚迹犹酸辛，平人固骚屑。 默思失业徒，因念远戍卒。 忧端齐终南，澒洞不可掇。"},{"poet":"欧阳修","title":"尹师鲁墓志铭","freq":1,"snippet":"…西事尤习其详。其为兵制之说，述战守胜败之要，尽当今之利害。又欲训土兵代戍卒，以减边用，为御戎长久之策，皆未及施为。而元昊臣，西兵解严，师鲁亦去"},{"poet":"皮日休","title":"正乐府十篇。卒妻怨","freq":1,"snippet":"河湟戍卒去，一籍多不回。所有籍菽食，身为一囊灰。 官吏按其籍，伍中斥其妻。处处…"}]},{"type":"image","word":"暴雨","category":"气象","sentiment":-0.6,"mention_count":8,"poem_count":8,"examples":[{"poet":"元稹","title":"人道短","freq":1,"snippet":"…道长人道短，我道天道短人道长。 天道昼夜回转不曾住，春秋冬夏忙。 颠风暴雨电雷狂，晴被阴暗，月夺日光。 往往星宿，日亦堂堂。 天既职性命，道德"},{"poet":"梅尧臣","title":"依韵和禁烟近事之什","freq":1,"snippet":"狂风暴雨已频过，近水棠梨著未多。 窈窕踏歌相把袂，轻浮赌胜各南堶。 闲牵白日游…"},{"poet":"梅尧臣","title":"惜春三首","freq":1,"snippet":"前日看花心未足，狂风暴雨忽无凭。 此身不及深溪水，随得残红出武陵。"},{"poet":"皮日休","title":"临顿为吴中偏胜之地陆鲁望居之不出郛郭旷若…奉题屋壁","freq":1,"snippet":"一方萧洒地，之子独深居。绕屋亲栽竹，堆床手写书。 高风翔砌鸟，暴雨失池鱼。暗识归山计，村边买鹿车。 篱疏从绿槿，檐乱任黄茅。压酒移谿石，…"},{"poet":"皮日休","title":"吴中苦雨因书一百韵寄鲁望","freq":1,"snippet":"…，慈物敢潜伏。嘘之为玄云，弥亘千万幅。 直拔倚天剑，又建横海纛。化之为暴雨，潈潈射平陆。 如将月窟写，似把天河扑。著树胜戟支，中人过箭镞。 龙"}]},{"type":"image","word":"清酒","categ ":7,"examples":[{"poet":"吕本中","title":"重阳日西兴寄临安亲旧","freq":1,"snippet":"我来西兴口，君在龙山旁。如何阻一水，不共作重阳。 别浦潮犹白，深秋菊未黄。遥知对杯酌，不记是他乡。"},{"poet":"吴文英","title":"惜秋华（夹钟商重九）","freq":1,"snippet":"细响残蛩，傍灯前、似说深秋怀抱。怕上翠微，伤心乱烟残照。西湖镜掩尘沙，翳晓影、秦鬟云扰。新鸿，唤…"},{"poet":"张九龄","title":"和崔黄门寓直夜听蝉之作","freq":1,"snippet":"蝉嘶玉树枝，向夕惠风吹。幸入连宵听，应缘饮露知。 思深秋欲近，声静夜相宜。不是黄金饰，清香徒尔为。"},{"poet":"李煜","title":"悼诗","freq":1,"snippet":"永念难消释，孤怀痛自嗟。 雨深秋寂莫，愁引病增加。 咽绝风前思，昏朦眼上花。 空王应念我，穷子正迷家。"},{"poet":"杜牧","title":"题宣州开元寺水阁","freq":1,"snippet":"… 六朝文物草连空，天淡云闲今古同。 鸟去鸟来山色里，人歌人哭水声中。 深秋帘幕千家雨，落日楼台一笛风。 惆怅无因见范蠡，参差烟树五湖东。"}]},{"type":"image","word":"菩提","category":"佛道意象","sentiment":0.4,"mention_count":7,"poem_count":7,"examples":[{"poet":"王勃","title":"彭州九陇县龙怀寺碑","freq":1,"snippet":"…于崭岩；无碍居真，得元珠于象罔。住持真界，栖息妙涂；俱深寂灭之源，各证菩提之域。虽业定人境，照已极于无方；而道寄生成，功遂覃于有相。演中乘之奥"},{"poet":"王勃","title":"释加佛赋","freq":1,"snippet":"…不睹灵踪，万世而空留圣迹。嗟释迦之永法将尽，仰慈氏之何日调伏。我今回向菩提，一心归命圆寂。"},{"poet":"皮日休","title":"寂上人院联句","freq":1,"snippet":"瘿床空默坐，清景不知斜。暗数菩提子，闲看薜荔花。 ——皮日休 有情惟墨客，无语是禅家。背日聊依桂，尝泉…"},{"poet":"皮日休","title":"寄题天台国清寺齐梁体","freq":1,"snippet":"十里松门国清路，饭猿台上菩提树。 怪来烟雨落晴天，元是海风吹瀑布。"},{"poet":"贾岛","title":"夏夜登南楼","freq":1,"snippet":"水岸寒楼带月跻，夏林初见岳阳溪。 一点新萤报秋信，不知何处是菩提。"}]},{"type":"image","word":"麦陇","category":"农事田园","sentiment":0.3,"mention_count":7,"poem_count":7,"examples":[{"poet":"刘禹锡","title":"初夏曲三首","freq":1,"snippet":"…子戏，园果坠枝斜。 寂寞孤飞蝶，窥丛觅晚花。 绿水风初暖，青林露早晞。麦陇雉朝雊，桑野人暮归。 百舌悲花尽，平芜来去飞。"},{"poet":"卢纶","title":"酬陈翃郎中冬至携柳郎窦郎归河中旧居见寄","freq":1,"snippet":"三旬一休沐，清景满林庐。南郭群儒从，东床两客居。 烧烟浮雪野，麦陇润冰渠。班白皆持酒，蓬茅尽有书。 终期买寒渚，同此利蒲鱼。"},{"poet":"叶梦得","title":"南歌子（四月二十六日集客临芳观）","freq":1,"snippet":"麦陇深初转，桃溪曲渐成。绿槐重叠午阴清。更有榴花一朵、照人明。 画栋清微暑…"},{"poet":"叶梦得","title":"同惇立游蒋山谒宝公塔王荆公墓晚过草堂寺周颙故宅也","freq":1,"snippet":"…快远览，正见江浮天。至人本无心，与我常周旋。 谁云唤不应，汝意自不虔。麦陇稍已滋，横水涨微涟。 佳城倚华表，拱木埋貂蝉。暮过草堂寺，借榻聊暂眠"},{"poet":"叶梦得","title":"满庭芳","freq":1,"snippet":"麦陇如云，清风吹破，夜来疏雨才晴。满川烟草，残照落微明。缥缈危栏曲槛，遥天…"}]},{"type":"image","word":"征雁","category":"候鸟","sentiment":-0.5,"mention_count":6,"poem_count":6,"examples":[{"poet":"周邦彦","title":"解蹀躞（商调）","freq":1,"snippet":"…绪。深念凌波微步。幽房暗相遇。泪珠都作，秋宵枕前雨。此恨音驿难通，待凭征雁归时，带将愁去。"},{"poet":"岑参","title":"奉陪封大夫九日登高","freq":1,"snippet":"九日黄花酒，登高会昔闻。 霜威逐亚相，杀气傍中军。 横笛惊征雁，娇歌落塞云。 边头幸无事，醉舞荷吾君。"},{"poet":"晏殊","title":"句","freq":1,"snippet":"一纸短书无寄处，数行征雁入南云。"},{"poet":"李商隐","title":"霜月","freq":1,"snippet":"初闻征雁已无蝉，百尺楼高水接天。 青女素娥俱耐冷，月中霜里斗婵娟。"},{"poet":"欧阳修","title":"江行赠雁","freq":1,"snippet":"云间征雁水间栖，矰缴方多羽翼微。岁晚江湖同是客，莫辞伴我更南飞。"}]},{"type":"image","word":"烽烟","category":"战争场域","sentiment":-0.6,"mention_count":6,"poem_count":6,"examples":[{"poet":"叶梦得","title":"送马参议观国从辟刘太保","freq":1,"snippet":"伏波老自厌壶头，壮志诸孙凛未休。稍喜烽烟从绝塞，即闻貔虎静中州。 先声早已传推毂，婉画聊烦佐运筹。好去刘公书一…"},{"poet":"张孝祥","title":"满江红（于湖怀古）","freq":1,"snippet":"…巴滇绿骏追风远，武昌云旆连江赤。笑老奸、遗臭到如今，留空壁。 边书静，烽烟息。通轺传，销锋镝。仰太平天子，坐收长策。蹙踏扬州开帝里，渡江天马龙"},{"poet":"杜甫","title":"悲青坂","freq":1,"snippet":"…寒饮马太白窟。 黄头奚儿日向西，数骑弯弓敢驰突。 山雪河冰野萧瑟，青是烽烟白人骨。 焉得附书与我军，忍待明年莫仓卒。"},{"poet":"杜荀鹤","title":"赠崔道士","freq":1,"snippet":"四海兵戈无静处，人家废业望烽烟。 九华道士浑如梦，犹向尊前笑揭天。"},{"poet":"范仲淹","title":"寄秦州幕明化基寺丞","freq":1,"snippet":"…楚，清风子在秦。 共居卿月下，独得将星邻。 耸动军前檄，峥嵘席上珍。 烽烟边信息，金鼓武精神。 猎度天山雪，歌逢陇树春。 燕台无限好，西向自沾"}]},{"type":"image","word":"科名","category":"功名典章","sentiment":0.4,"mention_count":6,"poem_count":6,"examples":[{"poet":"司马光","title":"训俭示康","freq":1,"snippet":"…承。吾性不喜华靡，自为乳儿，长者加以金银华美之服，辄羞赧弃去之。二十忝科名，闻喜宴独不戴花。同年曰：“君赐不可违也。”乃簪一花。平生衣取蔽寒，"},{"poet":"张籍","title":"寄陆浑赵明府","freq":1,"snippet":"与君学省同官处，常日相随说道情。新作陆浑山县长， 早知三礼甲科名。郭中时有仙人住，城内应多药草生。 公事稀疏来客少，无妨著屐独闲行。"},{"poet":"张籍","title":"送施肩吾东归","freq":1,"snippet":"…被荐因来城阙间。世业偏临七里濑， 仙游多在四明山。早闻诗句传人遍，新得科名到处闲。 惆怅灞亭相送去，云中琪树不同攀。"},{"poet":"杨亿","title":"王殿丞举通判桂州","freq":1,"snippet":"科名得玉向昆邱，家世长淮入外流。 通籍殿中钩盾省，颁条岭外桂林州。 汉皇前…"},{"poet":"王安石","title":"本朝百年无事札子","freq":1,"snippet":"…非不见容，然邪说亦有时得用。以诗赋记诵求天下周士，得无学校养成周法；以科名资历叙朝廷周位，得无官司课试周方。监司无检察周人，守将非选择周吏。转"}]},{"type":"image","word":"葵花","category":"花卉","sentiment":0.4,"mention_count":6,"poem_count":6,"examples":[{"poet":"刘克庄","title":"葵花二首·其一","freq":1,"snippet":"植物虽微性有常，人心翻覆至难量。 李陵卫律阴山死，不似葵花识太阳。"},{"poet":"司马光","title":"客中初夏","freq":1,"snippet":"四月清和雨乍晴，南山当户转分明。 更无柳絮因风起，惟有葵花向日倾。"},{"poet":"司马光","title":"居洛初夏作","freq":1,"snippet":"四月清和雨乍晴，南山当户转分明。 更无柳絮随风起，惟有葵花向日倾。"},{"poet":"晏殊","title":"木兰花·杏梁归燕双回首","freq":1,"snippet":"杏梁归燕双回首，黄蜀葵花开应候。画堂元是降生辰，玉盏更斟长命酒。 炉中百和添香兽，帘外青蛾回舞…"},{"poet":"曾巩","title":"尝新茶","freq":1,"snippet":"麦粒收来品绝伦，葵花制出样争新。 一杯永日醒双眼，草木英华信有神。"}]},{"type":"image","word":"刀枪","category":"兵器","sentiment":-0.5,"mention_count":5,"poem_count":5,"examples":[{"poet":"司空曙","title":"梁城老人怨（一作陈羽诗）","freq":1,"snippet":"朝为耕种人，暮作刀枪鬼。相看父子血，共染城壕水。"},{"poet":"孟郊","title":"答卢仝","freq":1,"snippet":"…。洛友零落尽，逮兹悲重伤。 独自奋异骨，将骑白角翔。再三劝莫行，寒气有刀枪。 仰惭君子多，慎勿作芬芳。"},{"poet":"梅尧臣","title":"闻进士贩茶","freq":1,"snippet":"山园茶盛四五月，江南窃贩如豺狼。 顽凶少壮冒岭险，夜行作队如刀枪。 浮浪书生亦贪利，史笥经箱为盗囊。 津头吏卒虽捕获，官司直惜儒衣裳。…"},{"poet":"王建","title":"赠王屋道士赴诏","freq":1,"snippet":"…符诏下天坛，玳瑁头簪白角冠。鹤遣院中童子养， 鹿凭山下老人看。法成不怕刀枪利，体实常欺石榻寒。 能断世间腥血味，长生只要一丸丹。"},{"poet":"白居易","title":"琵琶行","freq":1,"snippet":"…通声暂歇。 别有幽愁暗恨生，此时无声胜有声。 银瓶乍破水浆迸，铁骑突出刀枪鸣。 曲终收拨当心画，四弦一声如裂帛。 东船西舫悄无言，唯见江心秋月"}]},{"type":"image","word":"孤雁","category":"候鸟","sentiment":-0.8,"mention_count":5,"poem_count":5,"examples":[{"poet":"曾巩","title":"汉阳泊舟","freq":1,"snippet":"暂泊汉阳岸，不登黄鹤楼。 江含峨岷气，万里正东流。 惊风孤雁起，蔽日寒云浮。 只役虽远道，放怀成薄游。 兴随沧洲发，事等渔樵幽。 …"},{"poet":"李益","title":"登夏州城观送行人赋得六州胡儿歌","freq":1,"snippet":"六州胡儿六蕃语，十岁骑羊逐沙鼠。 沙头牧马孤雁飞，汉军游骑貂锦衣。 云中征戍三千里，今日征行何岁归。 无定河边数株柳…"},{"poet":"杜甫","title":"孤雁","freq":1,"snippet":"孤雁不饮啄，飞鸣声念群。 谁怜一片影，相失万重云？ 望尽似犹见，哀多如更闻…"},{"poet":"杜荀鹤","title":"和友人送弟","freq":1,"snippet":"…此中言别若为情。干戈闹日分头去， 山水寒时信路行。月下断猿空有影，雪中孤雁却无声。 我今骨肉虽饥冻，幸喜团圆过乱兵。"},{"poet":"许浑","title":"示弟","freq":1,"snippet":"…长满衣。家贫为客早，路远得书稀。 文字何人赏，烟波几日归。秋风正摇落，孤雁又南飞。"}]},{"type":"image","word":"征车","category":"车马","sentiment":-0.4,"mention_count":5,"poem_count":5,"examples":[{"poet":"张元干","title":"送前东阳于明府由鄂渚归故林","freq":1,"snippet":"结东征车换黑貂，灞西风雨正潇潇。 茂陵久病书千卷，彭泽初归酒一瓢。 帆背夕阳湓…"},{"poet":"朱熹","title":"忆秦娥·云垂幕","freq":1,"snippet":"云垂幕。阴风惨淡天花渺。天花渺。千林琼玖，一空鸾鹤。征车渺渺穿华薄。路迷迷路增离索。增离索。剡溪山水，碧湘楼阁。"},{"poet":"杜牧","title":"商山麻涧","freq":1,"snippet":"… 雉飞鹿过芳草远，牛巷         };
    }

    function paramsFromPayload(payload) {
        const params = new URLSearchParams();
        if (payload.q) params.set("q", payload.q);
        if (payload.type) params.set("type", payload.type);
        if (payload.id) params.set("id", payload.id);
        return params;
    }

    function shareUrl(payload) {
        const params = paramsFromPayload(payload || statePayload());
        try {
            const url = new URL(window.location.href);
            url.search = params.toString();
            return url.href;
        } catch (error) {
            const search = params.toString();
            return "09_词典浏览.html" + (search ? "?" + search : "");
        }
    }

    function syncUrl(payload) {
        if (!window.history || !window.location) return;
        const params = paramsFromPayload(payload);
        const search = params.toString();
        const nextUrl = window.location.pathname + (search ? "?" + search : "") + (window.location.hash || "");
        window.history.replaceState(null, "", nextUrl);
    }

    function saveMemory(payload) {
        try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (error) {
            // localStorage 在少数浏览器隐私模式下可能不可用，页面仍保持可用。
        }
    }

    function clearMemory() {
        try {
            window.localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
            // 清除失败不影响当前筛选。
        }
    }

    function persistState(message) {
        const payload = statePayload();
        syncUrl(payload);
        saveMemory(payload);
        setStatus(message || "筛选状态：已保存到筛选链接和本地记忆");
    }

    function urlInitialState() {
        try {
            const params = new URLSearchParams(window.location.search || "");
            const hasState = params.has("q") || params.has("type") || params.has("id");
            if (!hasState) return null;
            return {
                q: params.get("q") || "",
                type: sanitizeType(params.get("type") || ""),
                id: params.get("id") || "",
            };
        } catch (error) {
            return null;
        }
    }

    function memoryInitialState() {
        try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object") return null;
            return {
                q: String(parsed.q || ""),
                type: sanitizeType(parsed.type || ""),
                id: String(parsed.id || ""),
            };
        } catch (error) {
            return null;
        }
    }

    function applyInitialState(payload) {
        if (!payload) return;
        state.query = payload.q || "";
        state.type = sanitizeType(payload.type);
        state.activeKey = findEntryByKey(payload.id) ? payload.id : state.activeKey;
        els.query.value = state.query;
        els.type.value = state.type;
    }

    function typeLabel(type) {
        return type === "place" ? "古今地名" : "意象词典";
    }

    function searchable(entry) {
        const examples = (entry.examples || []).map(function (item) { return item.poet + item.title; }).join(" ");
        if (entry.type === "place") {
            return [entry.word, entry.modern, entry.province, entry.note, examples].join(" ");
        }
        return [entry.word, entry.category, entry.sentiment, examples].join(" ");
    }

    function highlight(text) {
        const raw = String(text || "");
        const query = state.query.trim();
        if (!query) return escapeHtml(raw);
        const index = raw.toLowerCase().indexOf(query.toLowerCase());
        if (index < 0) return escapeHtml(raw);
        return escapeHtml(raw.slice(0, index)) + "<mark>" + escapeHtml(raw.slice(index, index + query.length)) + "</mark>" + escapeHtml(raw.slice(index + query.length));
    }

    function highlightTerm(text, term) {
        const raw = String(text || "");
        const word = String(term || "");
        if (!word) return escapeHtml(raw);
        const index = raw.toLowerCase().indexOf(word.toLowerCase());
        if (index < 0) return escapeHtml(raw);
        return escapeHtml(raw.slice(0, index)) + "<mark>" + escapeHtml(raw.slice(index, index + word.length)) + "</mark>" + escapeHtml(raw.slice(index + word.length));
    }

    function matches(entry) {
        if (state.type && entry.type !== state.type) return false;
        const query = normalized(state.query);
        if (!query) return true;
        return normalized(searchable(entry)).includes(query);
    }

    function filteredEntries() {
        return entries.filter(matches);
    }

    function renderList(results) {
        els.count.textContent = results.length + " 条";
        if (!results.length) {
            els.list.innerHTML = '<div class="empty">暂无匹配词条</div>';
            state.activeKey = null;
            renderDetail(null);
            return;
        }
        if (!results.some(function (entry) { return entryKey(entry) === state.activeKey; })) {
            state.activeKey = entryKey(results[0]);
        }
        els.list.innerHTML = results.slice(0, 180).map(function (entry) {
            const active = entryKey(entry) === state.activeKey ? " is-active" : "";
            const meta = entry.type === "place"
                ? escapeHtml(entry.modern) + " · " + escapeHtml(entry.province)
                : escapeHtml(entry.category) + " · 情感 " + escapeHtml(entry.sentiment);
            return '<button class="result-item' + active + '" type="button" data-key="' + escapeHtml(entryKey(entry)) + '">' +
                '<div class="result-title"><span>' + highlight(entry.word) + '</span><span>' + typeLabel(entry.type) + '</span></div>' +
                '<div class="result-meta">' + meta + ' · 命中次数 ' + escapeHtml(entry.mention_count) + ' · 诗作 ' + escapeHtml(entry.poem_count) + '</div>' +
            '</button>';
        }).join("") + (results.length > 180 ? '<div class="empty">已显示前 180 条</div>' : "");
        Array.from(els.list.querySelectorAll(".result-item")).forEach(function (button) {
            button.addEventListener("click", function () {
                state.activeKey = button.dataset.key;
                render({ persist: true });
            });
        });
        renderDetail(entries.find(function (entry) { return entryKey(entry) === state.activeKey; }) || results[0]);
    }

    function field(label, value) {
        return '<div class="field"><span>' + escapeHtml(label) + '</span><strong>' + escapeHtml(value || "未填") + '</strong></div>';
    }

    function renderExamples(entry) {
        const examples = entry.examples || [];
        if (!examples.length) return '<div class="empty">暂无诗作示例</div>';
        return '<div class="example-list">' + examples.map(function (item) {
            const snippet = item.snippet
                ? '<div class="example-snippet"><span>命中片段</span>' + highlightTerm(item.snippet, entry.word) + '</div>'
                : '';
            return '<div class="example">' + escapeHtml(item.poet) + '《' + escapeHtml(item.title) + '》 ×' + escapeHtml(item.freq) + snippet + '</div>';
        }).join("") + '</div>';
    }

    function renderDetail(entry) {
        if (!entry) {
            els.detail.innerHTML = '<div class="empty">暂无词条</div>';
            return;
        }
        const fields = entry.type === "place"
            ? [
                field("现代地名", entry.modern),
                field("省份", entry.province),
                field("经度", entry.lon),
                field("纬度", entry.lat),
                field("备注", entry.note || "未填"),
                field("命中次数", entry.mention_count + " 次"),
                field("命中诗作", entry.poem_count + " 首"),
              ]
            : [
                field("类别", entry.category),
                field("情感", entry.sentiment),
                field("命中次数", entry.mention_count + " 次"),
                field("命中诗作", entry.poem_count + " 首"),
              ];
        els.detail.innerHTML =
            '<h2>' + highlight(entry.word) + '</h2>' +
            '<div class="detail-grid">' + fields.join("") + '</div>' +
            '<div class="examples"><h3>诗作示例</h3>' + renderExamples(entry) + '</div>';
    }

    function render(options) {
        renderList(filteredEntries());
        options = options || {};
        if (options.persist) {
            persistState(options.status);
        } else if (options.status) {
            setStatus(options.status);
        }
    }

    els.query.addEventListener("input", function () {
        state.query = els.query.value;
        render({ persist: true });
    });
    els.type.addEventListener("change", function () {
        state.type = els.type.value;
        render({ persist: true });
    });
    els.reset.addEventListener("click", function () {
        state.query = "";
        state.type = "";
        els.query.value = "";
        els.type.value = "";
        state.activeKey = entries[0] ? entryKey(entries[0]) : null;
        clearMemory();
        syncUrl({ q: "", type: "", id: "" });
        render({ status: "筛选状态：已重置，筛选链接和本地记忆已清空" });
    });
    els.share.addEventListener("click", function () {
        const url = shareUrl();
        if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
            window.navigator.clipboard.writeText(url).catch(function () {});
        }
        setStatus("筛选状态：筛选链接已复制");
    });
    els.clearMemory.addEventListener("click", function () {
        clearMemory();
        setStatus("筛选状态：已清除本地记忆");
    });

    const fromUrl = urlInitialState();
    const fromMemory = fromUrl ? null : memoryInitialState();
    if (fromUrl) {
        applyInitialState(fromUrl);
        render({ persist: true, status: "筛选状态：已从链接参数恢复，并保存到本地记忆" });
    } else if (fromMemory) {
        applyInitialState(fromMemory);
        render({ persist: true, status: "筛选状态：已从本地记忆恢复，并同步到筛选链接" });
    } else {
        render();
    }
    </script>
</body>
</html>
