  <div class="cont">
    <h1>望庐山瀑布</h1>
    <p class="source"><a>唐代</a>：<a>李白</a></p>
    <div class="contson">日照香炉生紫烟，遥看瀑布挂前川。<br>飞流直下三千尺，疑是银河落九天。</div>
  </div>
  <div class="contyishang"><h2>译文</h2><p>香炉峰在阳光照射下生起紫色烟霞。</p></div>
  <div class="contyishang"><h2>注释</h2><p>香炉：指庐山香炉峰。</p></div>
