name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shixing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/agent-ui/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/agent-ui/web
        run: npm ci --legacy-peer-deps

      - name: Verify web application
        working-directory: apps/agent-ui/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-ui/agent/requirements.lock

      - name: Verify Agent API
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r apps/agent-ui/agent/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps \
            -e apps/agent-ui/agent
          python -m pytest apps/agent-ui/agent/tests

      - name: Build self-contained Agent API
        run: |
          mkdir -p release
          python -m pip install --disable-pip-version-check pex==2.100.4
          pex -r apps/agent-ui/agent/requirements.lock \
            --no-transitive \
            --sources-directory apps/agent-ui/agent \
            --python python3.12 \
            --python-shebang /usr/bin/python3 \
            --entry-point poetry_agent.main:run \
            --output-file release/poetry-agent.pex

      - name: Verify static release artifacts
        run: |
          python tools/famous_poet_corpus.py check --no-source-verify
          sed -i 's/\r$//' output/assets/poem_page/poem_page_data.js
          python tools/check_poem_page_data.py
          python tools/check_output_index.py
          python tools/check_theme_outputs.py

      - name: Package releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/web
          cp -a apps/agent-ui/web/.next/standalone/. release/web/
          mkdir -p release/web/.next
          cp -a apps/agent-ui/web/.next/static release/web/.next/static
          if [ -d apps/agent-ui/web/public ]; then
            cp -a apps/agent-ui/web/public release/web/public
          fi
          tar -C release/web -czf release/web-release.tar.gz .

          mkdir -p release/api
          git ls-files -z -- \
            apps/agent-ui/agent/poetry_agent \
            apps/agent-ui/agent/pyproject.toml \
            apps/agent-ui/agent/requirements.lock \
            tools/build_rich_guides_llm.py \
            tools/build_poem_page_data.py \
            data \
            output/assets/competition \
            "数据可视化脚本/viz_33_year759.py" \
            "数据可视化脚本/viz_38_imagery_tide.py" \
            | tar --null -T - -cf - \
            | tar -C release/api -xf -
          mv release/poetry-agent.pex release/api/poetry-agent.pex
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("release/api")
          paths = (
              "data/poems.json",
              "data/spirit_image_dict.py",
              "data/image_dict.py",
              "data/classical_emotion_model.py",
              "data/classical_emotion_lexicon.py",
              "apps/agent-ui/agent/poetry_agent/knowledge_builder.py",
          )
          hashes = {}
          for relative in paths:
              content = (root / relative).read_bytes().replace(b"\r\n", b"\n")
              hashes[relative] = hashlib.sha256(content).hexdigest()
          (root / "knowledge-source-hashes.json").write_text(
              json.dumps({"sourceHashes": hashes}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          tar -C release/api -czf release/api-release.tar.gz .
          (
            cd release/api
            env \
              -u AGENT_LLM_BASE_URL \
              -u AGENT_LLM_API_KEY \
              -u AGENT_LLM_MODEL \
              python -I - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          tools_dir = root / "tools"
          sys.path.insert(0, str(tools_dir))

          import build_rich_guides_llm as rich_guides

          expected_paths = {
              "build_rich_guides_llm": tools_dir / "build_rich_guides_llm.py",
              "build_poem_page_data": tools_dir / "build_poem_page_data.py",
          }
          actual_paths = {
              "build_rich_guides_llm": Path(rich_guides.__file__).resolve(),
              "build_poem_page_data": Path(rich_guides.ppd.__file__).resolve(),
          }
          if actual_paths != expected_paths:
              raise RuntimeError(f"API release imported unexpected modules: {actual_paths}")

          required_ppd_api = ("load_approved_backgrounds", "load_promoted_facts")
          missing = [name for name in required_ppd_api if not callable(getattr(rich_guides.ppd, name, None))]
          if missing:
              raise RuntimeError(f"build_poem_page_data API missing: {missing}")
          if rich_guides.ppd.load_promoted_facts(
              root / "__release_import_smoke_missing__.jsonl", "rule"
          ) != {}:
              raise RuntimeError("build_poem_page_data smoke returned unexpected data")
          print("API release rich-guide import smoke passed")
          PY
          )

          mkdir -p release/static
          git ls-files -z -- output \
            | tar --null -T - --transform='s,^output/,,' -cf - \
            | tar -C release/static -xf -
          cp release/static/29_参赛导航.html release/static/index.html
          tar -C release/static -czf release/static-release.tar.gz .

          (cd release && sha256sum *-release.tar.gz > SHA256SUMS)

      - name: Configure SSH
        id: deploy-config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] \
            || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped until the four DEPLOY_* secrets are configured."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        if: steps.deploy-config.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_dir="/tmp/shixing-deploy-${GITHUB_SHA}"
          ssh_opts=(
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote_dir'"
          scp "${ssh_opts[@]}" \
            release/web-release.tar.gz \
            release/api-release.tar.gz \
            release/static-release.tar.gz \
            release/SHA256SUMS \
            ops/deploy-server.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_dir/deploy-server.sh' '$GITHUB_SHA' '$remote_dir'"

      - name: Verify public endpoints
        if: steps.deploy-config.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 30 -fsS \
            "http://$DEPLOY_HOST/" \
            | grep -F '参赛导航' >/dev/null
          curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 30 -fsS \
            "http://$DEPLOY_HOST:3000/" >/dev/null
          curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 30 -fsS \
            "http://$DEPLOY_HOST:3000/api/backend/ready" \
            | jq -e '.status == "ok" and .sources.missing == [] and .sources.knowledgeBase.available == true' >/dev/null
          curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 30 -fsS \
            "http://$DEPLOY_HOST:3000/api/backend/catalog" \
            | jq -e '.status == "ok" and .payload.poetCount == 88' >/dev/null
          curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 30 -fsS \
            "http://$DEPLOY_HOST:3000/api/backend/knowledge/status" \
            | jq -e '.status == "ok" and .payload.available == true' >/dev/null
